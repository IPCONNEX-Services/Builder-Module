name: Builder checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: yarn test:unit
      - run: yarn build
      - run: yarn test:audit
      - run: yarn audit:lock

  integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      redis-cache:
        image: redis:7-alpine
        ports: ['13000:6379']
      redis-queue:
        image: redis:7-alpine
        ports: ['11000:6379']
      redis-socketio:
        image: redis:7-alpine
        ports: ['12000:6379']
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global yarn@1.22.22
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev redis-tools xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2
          echo '127.0.0.1 builder.test' | sudo tee -a /etc/hosts
          mysql --host 127.0.0.1 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"
      - name: Create disposable Frappe 15 bench
        run: |
          pip install frappe-bench
          bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench get-app builder "$GITHUB_WORKSPACE"
          bench new-site --db-host 127.0.0.1 --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%' builder.test
          bench --site builder.test install-app builder
          bench --site builder.test set-config allow_tests true
          bench --site builder.test set-config enable_telemetry false
          bench --site builder.test execute frappe.utils.install.complete_setup_wizard
          bench --site builder.test run-tests --app builder
          sed -i '/^watch:/d; /^schedule:/d; /^redis_/d; /^worker/d' Procfile
          bench start > ~/frappe-bench/bench_start.log 2>&1 &
      - name: Wait for test site
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://builder.test:8000/api/method/ping; then exit 0; fi
            sleep 2
          done
          cat ~/frappe-bench/bench_start.log
          exit 1
      - name: Browser regression tests
        working-directory: /home/runner/frappe-bench/apps/builder/frontend
        run: yarn test
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: builder-integration-failure
          path: |
            /home/runner/frappe-bench/bench_start.log
            /home/runner/frappe-bench/apps/builder/frontend/cypress/screenshots
            /home/runner/frappe-bench/logs
